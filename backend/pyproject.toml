[project]
name = "crm-piercing-tattoo-backend"
version = "0.1.0"
description = "SaaS B2B Multi-tenant CRM, Operacional e Financeiro para Estúdios de Piercing e Tatuagem"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
